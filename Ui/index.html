:root{--bg:#050507;--p1:#0b0b10;--p2:#111118;--line:#1d1d27;--fg:#ececf1;--mut:#8d8da0;--dim:#4a4a58;--amb:#ffc83d;--red:#ff3d5a;--ok:#41e0a0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:600 14px/1.5 "Open Sans","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;z-index:5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#23232e;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-columns:318px 1fr;height:100%}
.rail{display:flex;flex-direction:column;gap:22px;padding:26px 24px;background:linear-gradient(180deg,#0f0c15,#0b0a10);border-right:1px solid var(--line);overflow-y:auto}
main{overflow-y:auto;padding:28px 34px 40px;min-width:0}
@media(max-width:880px){.app{grid-template-columns:1fr;height:auto}.rail{border-right:0;border-bottom:1px solid var(--line)}html,body{overflow-y:auto;height:auto}}

.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:50px;height:50px;flex:none;filter:drop-shadow(0 6px 16px #ff3d5a30)}
.brand .name{font-size:22px;font-weight:800;letter-spacing:.5px;line-height:1.05}
.brand .sub{font-size:11px;letter-spacing:5px;color:var(--amb);font-weight:700;margin-top:3px}

.state{border:1px solid var(--line);background:var(--p1);padding:16px 16px 14px;position:relative}
.state::before,.state::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--amb);opacity:.9}
.state::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.state::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.pill{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.pill.on{color:var(--ok)}.pill.on .dot{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.pill.wait{color:var(--amb)}.pill.wait .dot{background:var(--amb);animation:pulse 1.3s infinite}
@keyframes pulse{50%{opacity:.2}}
.state h2{margin:12px 0 6px;font-size:21px;font-weight:800;line-height:1.2}
.state p{margin:0;color:var(--mut);font-size:13px;font-weight:500;word-break:break-word}
.msg{margin-top:10px;font-size:12.5px;font-weight:600;min-height:0}.msg:empty{display:none}
.msg.err{color:var(--red)}.msg.info{color:var(--amb)}

.start{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;height:76px;border:0;cursor:pointer;font:800 21px/1 "Open Sans",sans-serif;letter-spacing:3px;text-transform:uppercase;
  color:#0a0a0c;background:var(--amb);transition:.15s;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.start:hover{background:#ffd461;filter:drop-shadow(0 0 14px #ffc83d55)}
.start svg{width:22px;height:22px;fill:currentColor}
.start.stop{background:#1a0d12;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}.start.stop:hover{background:#26101a;filter:none}

.grow{flex:1}
.foot{display:flex;flex-direction:column;gap:14px}
.lbl{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:#9a9aae;font-weight:700;margin-bottom:7px}
.seg{display:flex;gap:0;border:1px solid #262633;background:var(--p1)}
.seg button{flex:1;min-width:0;border:0;border-right:1px solid var(--line);background:transparent;color:var(--mut);padding:9px 8px;cursor:pointer;font:700 13px "Open Sans",sans-serif;transition:.12s}
.seg button:last-child{border-right:0}.seg button:hover{color:var(--fg);background:var(--p2)}
.seg button.sel{background:var(--amb);color:#0a0a0c}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #262633;background:var(--p1)}
.toggle b{display:block;font-size:13px;font-weight:700}.toggle span{display:block;color:var(--mut);font-size:11.5px;font-weight:500;line-height:1.35}
.sw{position:relative;width:42px;height:22px;flex:none;border:1px solid #2b2b38;background:#0a0a0e;cursor:pointer;padding:0;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--mut);transition:.15s}
.sw.on{border-color:var(--amb)}.sw.on::after{left:23px;background:var(--amb)}
.btns{display:flex;gap:8px}
.btn{flex:1;border:1px solid #262633;background:var(--p1);color:#b4b4c4;padding:9px 10px;cursor:pointer;font:700 12.5px "Open Sans",sans-serif}
.btn:hover{color:var(--fg);background:var(--p2)}.btn.danger:hover{color:var(--red);border-color:#4a1a24}

h3{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:800;color:var(--fg)}
h3::before{content:"[";color:var(--amb);font-weight:800}h3::after{content:"]";color:var(--amb);font-weight:800}
h3 i{flex:1;height:1px;background:var(--line);order:3}h3::after{order:2}
section{margin-bottom:32px}

.list{border:1px solid var(--line);background:var(--p1)}
.mrow{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:6px;width:100%;padding:12px 16px 12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;text-align:left;font:inherit;position:relative;transition:.12s}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--p2)}
.mrow .num{text-align:center;font-size:24px;font-weight:800;color:#2a2a37;letter-spacing:-1px;transition:.12s}
.mrow .mt{font-size:15px;font-weight:800}
.mrow .md{font-size:12.5px;color:var(--mut);font-weight:500;margin-top:1px}
.mrow .k{font:700 11px "Cascadia Mono",Consolas,monospace;color:var(--dim);border:1px solid var(--line);padding:2px 8px;background:#08080b}
.mrow.sel{background:linear-gradient(90deg,#ffc83d1c,transparent 75%)}
.mrow.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amb)}
.mrow.sel .num{color:var(--amb)}.mrow.sel .k{color:var(--amb);border-color:#5a4713}

.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}@media(max-width:1020px){.two{grid-template-columns:1fr}}
.hint{color:var(--mut);font-size:12.5px;font-weight:500;margin:10px 0 0}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 26px;border:1px solid var(--line);background:var(--p1);padding:16px 18px;color:var(--mut);font-size:13px;font-weight:600}
kbd{display:inline-block;min-width:26px;text-align:center;background:#08080b;border:1px solid #262633;border-bottom-width:2px;padding:1px 7px;color:var(--fg);font:700 11.5px "Cascadia Mono",Consolas,monospace;margin-right:2px}
</style></head><body>
<div class="app">
<aside class="rail">
  <div class="brand"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1328"/><stop offset="1" stop-color="#06060a"/></linearGradient><linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc83d"/><stop offset="1" stop-color="#ff3d5a"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#gb)"/><path d="M200,92 L92,92 L92,200 M312,92 L420,92 L420,200 M200,420 L92,420 L92,312 M312,420 L420,420 L420,312" fill="none" stroke="url(#gs)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M256,130 Q256,262 388,262 Q256,262 256,394 Q256,262 124,262 Q256,262 256,130Z" fill="#fff7de"/><path d="M350,132 Q350,170 388,170 Q350,170 350,208 Q350,170 312,170 Q350,170 350,132Z" fill="#fff7de"/></svg><div><div class="name">ANIME4K</div><div class="sub">SCALER</div></div></div>

  <div class="state">
    <div id="pill" class="pill"><span class="dot"></span><span id="pillTxt">…</span></div>
    <h2 id="heroT">…</h2><p id="heroP"></p><div id="heroM" class="msg"></div>
  </div>

  <button id="start" class="start"><svg id="ico" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><span id="startTxt">…</span></button>

  <div class="grow"></div>

  <div class="foot">
    <div><div class="lbl" data-i18n="h_lang"></div><div class="seg" id="lang"><button data-v="tr">Türkçe</button><button data-v="en">English</button></div></div>
    <div class="toggle"><div class="grow"><b data-i18n="auto_t"></b><span data-i18n="auto_d"></span></div><button id="auto" class="sw"></button></div>
    <div class="btns"><button class="btn" id="hide" data-i18n="hide"></button><button class="btn danger" id="quit" data-i18n="quit"></button></div>
  </div>
</aside>

<main>
  <section><h3><span data-i18n="h_mode"></span><i></i></h3><div class="list" id="modes"></div></section>

  <div class="two">
    <section><h3><span data-i18n="h_quality"></span><i></i></h3>
      <div class="seg" id="quality"><button data-v="HQ" data-i18n="hq"></button><button data-v="FAST" data-i18n="fast"></button></div>
      <p class="hint" data-i18n="quality_hint"></p></section>
    <section><h3><span data-i18n="h_src"></span><i></i></h3>
      <div class="seg" id="srcH"><button data-v="480">480p</button><button data-v="540">540p</button><button data-v="720">720p</button><button data-v="1080">1080p</button><button data-v="0" data-i18n="screen"></button></div>
      <p class="hint" data-i18n="src_hint"></p></section>
  </div>

  <section><h3><span data-i18n="h_keys"></span><i></i></h3>
    <div class="keys">
      <div><kbd>F9</kbd> <span data-i18n="k_toggle"></span></div>
      <div><kbd>Alt</kbd>+<kbd>1</kbd>…<kbd>6</kbd> <span data-i18n="k_modes"></span></div>
      <div><kbd>Alt</kbd>+<kbd>0</kbd> <span data-i18n="k_orig"></span></div>
      <div><kbd>Alt</kbd>+<kbd>Q</kbd> <span data-i18n="k_quality"></span></div>
      <div><kbd>F10</kbd> <span data-i18n="k_src"></span></div>
    </div></section>
</main>
</div>

<script>
const $=s=>document.querySelector(s);
const send=o=>window.chrome.webview.postMessage(JSON.stringify(o));
const I18N={
 tr:{h_lang:'Dil',h_mode:'Mod',h_quality:'Kalite',h_src:'Kaynak çözünürlüğü',h_keys:'Kısayollar',
  hq:'Yüksek kalite',fast:'Hızlı',screen:'Ekran',
  quality_hint:'Yüksek kalite daha güçlü GPU ister. Kare atlıyorsa Hızlı\'ya geç (Alt+Q).',
  src_hint:'Tam ekranda video zaten büyütülmüş olur. Videonun gerçek çözünürlüğünü seç ki Anime4K doğru ölçekte çalışsın (F10 ile döngü).',
  auto_t:'Windows ile başlat',auto_d:'Oturum açınca tepsiye küçülmüş açılır.',hide:'Tepsiye küçült',quit:'Çıkış',
  k_toggle:'Başlat / Durdur',k_modes:'Mod A, B, C, A+A, B+B, C+A',k_orig:'Orijinal görüntü',k_quality:'Kaliteyi değiştir',k_src:'Kaynak çözünürlüğü',
  start:'Başlat',stop:'Durdur',
  pill_off:'Durduruldu',pill_wait:'Bekliyor',pill_on:'Aktif',
  hero_off_t:'Hazır',hero_off_p:'Başlat\'a bas; tam ekran bir video açılınca otomatik ölçeklenir.',
  hero_wait_t:'Tam ekran bekleniyor',hero_wait_p:'Bir videoyu tam ekran yap, ölçekleme kendiliğinden başlar.',
  hero_on_t:'Anime4K çalışıyor',
  mode:'Mod',orig:'Orijinal',src:'kaynak',passes:'geçiş',noup:'yükseltme gerekmedi',
  modes:[['Orijinal','Anime4K kapalı, karşılaştırma için'],['Mod A','Keskinleştir + yükselt · çoğu anime için genel seçim'],['Mod B','Yumuşak restore + yükselt · hafif bulanık / ringing\'li kaynak'],['Mod C','Denoise + yükselt · temiz, yüksek kaliteli kaynak'],['Mod A+A','A + ikinci restore · daha güçlü netlik'],['Mod B+B','B + ikinci yumuşak restore'],['Mod C+A','C + ikinci restore · temiz kaynakta ekstra netlik']]},
 en:{h_lang:'Language',h_mode:'Mode',h_quality:'Quality',h_src:'Source resolution',h_keys:'Shortcuts',
  hq:'High quality',fast:'Fast',screen:'Screen',
  quality_hint:'High quality needs a stronger GPU. If frames drop, switch to Fast (Alt+Q).',
  src_hint:'In fullscreen the video is already enlarged. Pick the video\'s real resolution so Anime4K works at the right scale (F10 cycles).',
  auto_t:'Start with Windows',auto_d:'Launches minimized to the tray at sign-in.',hide:'Minimize to tray',quit:'Quit',
  k_toggle:'Start / Stop',k_modes:'Mode A, B, C, A+A, B+B, C+A',k_orig:'Original image',k_quality:'Toggle quality',k_src:'Source resolution',
  start:'Start',stop:'Stop',
  pill_off:'Stopped',pill_wait:'Waiting',pill_on:'Active',
  hero_off_t:'Ready',hero_off_p:'Press Start; it scales automatically once a video goes fullscreen.',
  hero_wait_t:'Waiting for fullscreen',hero_wait_p:'Make a video fullscreen and scaling starts by itself.',
  hero_on_t:'Anime4K is running',
  mode:'Mode',orig:'Original',src:'source',passes:'passes',noup:'no upscaling needed',
  modes:[['Original','Anime4K off, for comparison'],['Mode A','Sharpen + upscale · general choice for most anime'],['Mode B','Soft restore + upscale · slightly blurry / ringing sources'],['Mode C','Denoise + upscale · clean, high-quality sources'],['Mode A+A','A + second restore · stronger sharpness'],['Mode B+B','B + second soft restore'],['Mode C+A','C + second restore · extra sharpness on clean sources']]}
};
let lang=(navigator.language||'').startsWith('tr')?'tr':'en',langInit=false,st={enabled:false,active:false,mode:1,quality:'HQ',sourceHeight:720,modeNames:['A','B','C','A+A','B+B','C+A']};
const L=()=>I18N[lang];
const modesEl=$('#modes');
for(let i=0;i<7;i++){const b=document.createElement('button');b.className='mrow';b.dataset.m=i;
 b.innerHTML='<div class="num"></div><div><div class="mt"></div><div class="md"></div></div><div class="k"></div>';
 b.querySelector('.num').textContent='0'+i;b.querySelector('.k').textContent='Alt+'+i;
 b.onclick=()=>send({cmd:'mode',value:i});modesEl.append(b)}
function seg(id,key,conv){$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>send({cmd:key,value:conv(b.dataset.v)}))}
seg('#quality','quality',v=>v);seg('#srcH','sourceHeight',v=>+v);
$('#start').onclick=()=>send({cmd:'enabled',value:!st.enabled});
$('#auto').onclick=()=>send({cmd:'autostart',value:!st.autostart});
$('#hide').onclick=()=>send({cmd:'hide'});$('#quit').onclick=()=>send({cmd:'quit'});
$('#lang').querySelectorAll('button').forEach(b=>b.onclick=()=>{lang=b.dataset.v;send({cmd:'language',value:lang});apply();render()});
function apply(){
 document.documentElement.lang=lang; // CSS büyük harf dönüşümü (i/İ) için gerekli
 document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=L()[e.dataset.i18n]);
 modesEl.querySelectorAll('.mrow').forEach(c=>{const m=L().modes[+c.dataset.m];c.querySelector('.mt').textContent=m[0];c.querySelector('.md').textContent=m[1]});
 $('#lang').querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b.dataset.v===lang));
}
function render(){
 const t=L(),run=st.enabled;
 const pill=$('#pill');pill.className='pill '+(!run?'':st.active?'on':'wait');
 $('#pillTxt').textContent=!run?t.pill_off:st.active?t.pill_on:t.pill_wait;
 $('#startTxt').textContent=run?t.stop:t.start;
 $('#start').classList.toggle('stop',run);
 $('#ico').innerHTML=run?'<rect x="6" y="6" width="12" height="12"/>':'<path d="M7 4l13 8-13 8z"/>';
 const modeLbl=st.mode===0?t.orig:t.mode+' '+st.modeNames[st.mode-1]+' · '+(st.quality==='HQ'?t.hq:t.fast);
 $('#heroT').textContent=!run?t.hero_off_t:st.active?t.hero_on_t:t.hero_wait_t;
 let p=!run?t.hero_off_p:st.active?modeLbl:t.hero_wait_p;
 if(run&&st.active&&st.info){const i=st.info;p+=' · '+t.src+' '+i.srcW+'×'+i.srcH+' » '+i.outW+'×'+i.outH+' · '+i.steps+' '+t.passes+(i.mode>0&&i.steps===0?' ('+t.noup+')':'')}
 else if(run&&!st.active)p+=' · '+modeLbl;
 $('#heroP').textContent=p;
 const m=$('#heroM');m.className='msg '+(st.messageIsError?'err':'info');m.textContent=st.message||'';
 modesEl.querySelectorAll('.mrow').forEach(c=>c.classList.toggle('sel',+c.dataset.m===st.mode));
 $('#quality').querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b.dataset.v===st.quality));
 $('#srcH').querySelectorAll('button').forEach(b=>b.classList.toggle('sel',+b.dataset.v===st.sourceHeight));
 $('#auto').classList.toggle('on',!!st.autostart);
}
window.chrome.webview.addEventListener('message',e=>{st=JSON.parse(e.data);if(!langInit&&st.language){lang=st.language;langInit=true;apply()}render()});
apply();render();send({cmd:'ready'});
</script></body></html>
